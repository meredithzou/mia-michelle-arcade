<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Little Chef Kitchen</title>
  <desc id="desc">A playful cooking station with Bunny Bella ordering a hot dog, colorful ingredients, and a cooking plate.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#fff9ed"/><stop offset="1" stop-color="#fcebd7"/>
    </linearGradient>
    <linearGradient id="button" x2="0" y2="1">
      <stop stop-color="#f6ad6b"/><stop offset="1" stop-color="#e27f58"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#6d4836" flood-opacity=".12"/>
    </filter>
    <g id="bunny">
      <ellipse cx="23" cy="17" rx="9" ry="20" fill="#f9efdd" stroke="#debb9e" stroke-width="2" transform="rotate(-13 23 17)"/>
      <ellipse cx="47" cy="17" rx="9" ry="20" fill="#f9efdd" stroke="#debb9e" stroke-width="2" transform="rotate(13 47 17)"/>
      <ellipse cx="23" cy="18" rx="4" ry="13" fill="#f7bfbd" transform="rotate(-13 23 18)"/>
      <ellipse cx="47" cy="18" rx="4" ry="13" fill="#f7bfbd" transform="rotate(13 47 18)"/>
      <circle cx="35" cy="44" r="25" fill="#fff7e8" stroke="#debb9e" stroke-width="2"/>
      <circle cx="26" cy="42" r="3" fill="#694b42"/><circle cx="44" cy="42" r="3" fill="#694b42"/>
      <ellipse cx="20" cy="49" rx="6" ry="3" fill="#fac9c4"/><ellipse cx="50" cy="49" rx="6" ry="3" fill="#fac9c4"/>
      <path d="M31 51 Q35 55 39 51" fill="none" stroke="#a76d63" stroke-width="2" stroke-linecap="round"/>
      <path d="M31 48 L39 48 L35 52Z" fill="#d88d91"/>
    </g>
    <g id="bun"><rect x="8" y="14" width="54" height="43" rx="19" fill="#e3a862" stroke="#c78847" stroke-width="3"/><path d="M19 25 Q32 17 50 27" fill="none" stroke="#f6d49d" stroke-width="6" stroke-linecap="round"/></g>
    <g id="sausage"><rect x="7" y="22" width="56" height="26" rx="13" fill="#bd5149" stroke="#993a36" stroke-width="3" transform="rotate(-15 35 35)"/><path d="M18 30 Q38 24 52 29" fill="none" stroke="#e78672" stroke-width="4" stroke-linecap="round"/></g>
    <g id="hotdog"><rect x="7" y="14" width="56" height="42" rx="20" fill="#e1a45e" stroke="#c58945" stroke-width="3"/><rect x="13" y="24" width="45" height="23" rx="12" fill="#bf5346" transform="rotate(-13 35 35)"/><path d="M17 34 L26 29 L34 38 L43 28 L53 34" fill="none" stroke="#ffcc46" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="mustard"><rect x="27" y="8" width="16" height="9" rx="3" fill="#b88123"/><rect x="20" y="15" width="30" height="48" rx="10" fill="#f5c83f" stroke="#cc9d26" stroke-width="3"/><rect x="25" y="35" width="20" height="17" rx="5" fill="#fff7da"/><text x="35" y="48" font-size="12" font-weight="900" text-anchor="middle" fill="#bb8c25">M</text></g>
    <g id="cheese"><path d="M10 48 L55 17 L61 52 Q38 58 10 48Z" fill="#fbcf48" stroke="#d9ac30" stroke-width="3"/><circle cx="42" cy="39" r="5" fill="#e1af2b"/><circle cx="24" cy="47" r="4" fill="#e1af2b"/><circle cx="51" cy="49" r="3" fill="#e1af2b"/></g>
    <g id="tomato"><circle cx="35" cy="38" r="24" fill="#e34d41" stroke="#bc3a35" stroke-width="3"/><path d="M35 12 L39 24 L52 20 L44 30 L56 33 L41 35 L35 45 L29 35 L14 33 L26 29 L18 20 L31 24Z" fill="#49934b"/><path d="M35 17 V9" stroke="#447c42" stroke-width="4" stroke-linecap="round"/></g>
    <g id="onion"><circle cx="35" cy="36" r="25" fill="#dcae76" stroke="#bc8b58" stroke-width="3"/><circle cx="35" cy="36" r="17" fill="none" stroke="#f6d9ae" stroke-width="4"/><circle cx="35" cy="36" r="8" fill="none" stroke="#f6d9ae" stroke-width="3"/><path d="M35 11 Q31 3 35 1 Q42 8 35 11" fill="#b7885e"/></g>
    <g id="pickle"><rect x="12" y="20" width="46" height="28" rx="14" fill="#77b65d" stroke="#4d8b3e" stroke-width="3" transform="rotate(-25 35 35)"/><circle cx="24" cy="31" r="2" fill="#a9d782"/><circle cx="41" cy="40" r="2" fill="#a9d782"/><circle cx="48" cy="26" r="2" fill="#a9d782"/></g>
    <g id="lettuce"><path d="M9 44 Q3 33 18 22 Q26 8 37 17 Q53 9 56 25 Q69 32 55 43 Q50 62 37 54 Q19 66 9 44Z" fill="#88be64" stroke="#5c974b" stroke-width="3"/><path d="M17 44 Q35 37 50 25 M35 37 L29 22 M35 37 L52 42" stroke="#c1db91" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="600" rx="24" fill="url(#bg)"/>
  <g font-family="Trebuchet MS, Arial, sans-serif" fill="#654238">
    <rect x="28" y="23" width="904" height="137" rx="22" fill="#fffdf9" stroke="#ead9be" stroke-width="3" filter="url(#shadow)"/>
    <rect x="47" y="43" width="100" height="100" rx="22" fill="#ffedd6"/>
    <use href="#bunny" x="60" y="56" width="75" height="75"/>
    <text x="173" y="63" font-size="17" font-weight="800" fill="#aa7c62" letter-spacing="2">BUNNY BELLA IS HUNGRY</text>
    <use href="#hotdog" x="174" y="70" width="47" height="47"/>
    <text x="253" y="105" font-size="34" font-weight="900">Classic Hot Dog!</text>
    <text x="173" y="137" font-size="19" fill="#956f5b">Hot Dog Bun  ·  Sausage  ·  Ketchup  ·  Mustard</text>

    <text x="32" y="201" font-size="24" font-weight="900">Choose Your Ingredients</text>
    <text x="577" y="201" font-size="24" font-weight="900">Kitchen Counter</text>
    <rect x="574" y="216" width="358" height="352" rx="21" fill="#f8ead6" stroke="#e5c5a1" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="594" y="250" font-size="19" font-weight="800">My Cooking Plate</text>
    <text x="908" y="250" font-size="15" text-anchor="end" fill="#a67b60">3 / 4</text>
    <rect x="594" y="266" width="318" height="205" rx="19" fill="#e9d7bd"/>
    <circle cx="753" cy="366" r="92" fill="#fff" stroke="#fafafa" stroke-width="12" filter="url(#shadow)"/>
    <circle cx="753" cy="366" r="80" fill="#f7f7f5" stroke="#e4e8e2" stroke-width="11"/>
    <use href="#bun" x="694" y="343" width="65" height="65"/>
    <use href="#sausage" x="755" y="363" width="61" height="61"/>
    <use href="#mustard" x="739" y="306" width="50" height="50"/>
    <rect x="700" y="489" width="212" height="57" rx="14" fill="#bd6247" opacity=".24"/>
    <rect x="700" y="484" width="212" height="57" rx="14" fill="url(#button)"/>
    <text x="806" y="521" font-size="20" font-weight="900" text-anchor="middle" fill="white">Prepare Food!</text>
  </g>
  <g font-family="Trebuchet MS, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#614137">
    <rect x="27" y="218" width="163" height="104" rx="17" fill="#e7f4dd" stroke="#90c27e" stroke-width="3"/>
    <use href="#bun" x="76" y="226" width="65" height="65"/><text x="108" y="307" font-size="17">Hot Dog Bun</text>
    <rect x="204" y="218" width="163" height="104" rx="17" fill="#e7f4dd" stroke="#90c27e" stroke-width="3"/>
    <use href="#sausage" x="253" y="226" width="65" height="65"/><text x="285" y="307" font-size="17">Sausage</text>
    <rect x="381" y="218" width="163" height="104" rx="17" fill="#e7f4dd" stroke="#90c27e" stroke-width="3"/>
    <text x="462" y="307" font-size="17">Ketchup</text>
    <rect x="27" y="335" width="163" height="104" rx="17" fill="white" stroke="#ebd9c4" stroke-width="3"/>
    <use href="#mustard" x="76" y="343" width="65" height="65"/><text x="108" y="424" font-size="17">Mustard</text>
    <rect x="204" y="335" width="163" height="104" rx="17" fill="white" stroke="#ebd9c4" stroke-width="3"/>
    <use href="#cheese" x="253" y="343" width="65" height="65"/><text x="285" y="424" font-size="17">Cheese</text>
    <rect x="381" y="335" width="163" height="104" rx="17" fill="white" stroke="#ebd9c4" stroke-width="3"/>
    <use href="#tomato" x="430" y="343" width="65" height="65"/><text x="462" y="424" font-size="17">Tomato</text>
    <rect x="27" y="452" width="163" height="104" rx="17" fill="white" stroke="#ebd9c4" stroke-width="3"/>
    <use href="#onion" x="76" y="460" width="65" height="65"/><text x="108" y="541" font-size="17">Onion</text>
    <rect x="204" y="452" width="163" height="104" rx="17" fill="white" stroke="#ebd9c4" stroke-width="3"/>
    <use href="#pickle" x="253" y="460" width="65" height="65"/><text x="285" y="541" font-size="17">Pickle</text>
    <rect x="381" y="452" width="163" height="104" rx="17" fill="white" stroke="#ebd9c4" stroke-width="3"/>
    <use href="#lettuce" x="430" y="460" width="65" height="65"/><text x="462" y="541" font-size="17">Lettuce</text>
  </g>
  <!-- Ketchup bottle matching the game's CSS illustration. -->
  <g transform="translate(441 240)">
    <rect x="15" y="2" width="12" height="13" rx="3" fill="#be3231" stroke="#a92829" stroke-width="2"/>
    <rect x="4" y="14" width="34" height="49" rx="12" fill="#df4038" stroke="#ad2b2c" stroke-width="2"/>
    <path d="M10 17 Q7 36 11 57" fill="none" stroke="#ff7662" stroke-width="4" opacity=".6"/>
    <rect x="11" y="37" width="20" height="19" rx="5" fill="#fff5df"/>
    <text x="21" y="51" font-family="Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="900" text-anchor="middle" fill="#d43834">K</text>
  </g>
</svg>
