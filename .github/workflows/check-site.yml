name: Check static arcade site
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_settings.cjs
