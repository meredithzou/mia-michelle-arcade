<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Domino Knockdown!</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff0e6;color:#644332;font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:20px}header{text-align:center;margin:10px 0 18px}h1{font-size:clamp(28px,5vw,44px);margin:6px 0}p{margin:8px 0;color:#896650}.tag{letter-spacing:3px;font-size:11px;font-weight:750}.board{position:relative;background:#f6dbbb;border:6px solid #fff9ef;border-radius:28px;overflow:hidden;box-shadow:0 10px 35px #8c503010}canvas{width:100%;display:block;aspect-ratio:1.65;touch-action:none}.status{position:absolute;top:14px;left:17px;background:#fff9efe6;padding:8px 13px;border-radius:20px;font-size:14px;pointer-events:none}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}button{font:inherit;font-weight:700;min-height:48px;padding:11px 20px;border:1px solid #dec1a3;border-radius:16px;background:#fff9ef;color:#644332;cursor:pointer}button.primary{background:#985535;color:white;border-color:#985535}button.selected{background:#f3c49e;outline:2px solid #b7794f}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #b58431;outline-offset:3px}.hint{text-align:center;font-size:14px;min-height:42px}.footer{text-align:center;font-size:12px;color:#99755b}@media(max-width:600px){main{padding:12px}canvas{aspect-ratio:1.1}button{padding:10px 14px}.status{font-size:12px}header{margin-top:18px}}
</style><link rel="stylesheet" href="../../shared/arcade-nav.css"></head><body class="arcade-game-page" style="--arcade-return-bg:#985535"><a class="arcade-return" href="../../index.html">← Mia and Michelle’s Arcade</a><main><header><div class="tag">MIA & MICHELLE’S ARCADE</div><h1>Domino Knockdown!</h1><p>A little push. A whole lot of tumble.</p></header><div class="board"><canvas id="board" aria-label="Domino play area. Tap to push the chain, or select Draw a path and drag your finger."></canvas><div class="status" id="status" aria-live="polite"></div></div><div class="controls"><button class="primary" id="push">▶ Push!</button><button id="reset">↻ Stand them up</button><button id="twist">New twisty path</button><button id="draw" aria-pressed="false">✎ Draw a path</button><button id="undo">↶ Undo line</button><button id="clear">Clear board</button><button id="sound" aria-pressed="false">Sound: Off</button></div><p class="hint" id="hint">Tap the first domino or press Push! to start the tumble.</p><p class="footer">Made for little fingers and big chain reactions.</p></main><script>
'use strict';
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),statusEl=document.getElementById('status'),hint=document.getElementById('hint');const btn=Object.fromEntries(['push','reset','twist','draw','sound','undo','clear'].map(id=>[id,document.getElementById(id)]));
let paths=[],pointer=null,points=[],raw=[],running=false,drawing=false,dragging=false,start=0,variant=0,lastSound=-1,audio=null,soundOn=false,completed=false;
const W=1000,H=610,spacing=22,delay=67;let viewH=H;
function fit(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);viewH=W*r.height/r.width;paint(performance.now())}new ResizeObserver(fit).observe(canvas);
function resample(arr){let out=[];if(!arr.length)return out;out.push({...arr[0]});let prev=arr[0],left=0;for(let i=1;i<arr.length;i++){let next=arr[i],dx=next.x-prev.x,dy=next.y-prev.y,len=Math.hypot(dx,dy);while(left+len>=spacing){let f=(spacing-left)/len;prev={x:prev.x+dx*f,y:prev.y+dy*f};out.push({...prev});dx=next.x-prev.x;dy=next.y-prev.y;len=Math.hypot(dx,dy);left=0;if(out.length>=240)return out}left+=len;prev=next}return out}
function rebuild(){points=paths.flatMap((path,group)=>path.map((p,step)=>({...p,group,step})));update()}
function preset(){stop();drawing=false;sync();raw=[];for(let i=0;i<=900;i++){let t=i/900;raw.push({x:110+780*t,y:H*.54+145*Math.sin(t*Math.PI*(variant%2?5:4)+variant*.7)*Math.sin(Math.PI*t)})}paths=[resample(raw)];rebuild()}
function stop(){dragging=false;pointer=null;running=false;completed=false;lastSound=-1;start=0}function sync(){btn.draw.classList.toggle('selected',drawing);btn.draw.setAttribute('aria-pressed',drawing);canvas.style.cursor=drawing?'crosshair':'pointer'}
function update(){btn.push.disabled=running||dragging||!points.length;btn.undo.disabled=running||dragging||!paths.length;btn.clear.disabled=running||dragging||!paths.length;btn.draw.disabled=running;btn.twist.disabled=running;statusEl.textContent=running?'Here they go…':completed?'All down! ✨':points.length+' dominoes ready';hint.textContent=drawing?'Draw a line, lift your finger, then draw more! Push! starts every line.':completed?'That was satisfying! Stand them up and try again.':'Tap the first domino or press Push! to start the tumble.'}
function push(){if(running||dragging||!points.length)return;if(completed)stop();drawing=false;sync();running=true;start=performance.now();if(soundOn)initAudio();update()}
function initAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}function clickSound(){if(!soundOn||!audio||audio.state!=='running')return;let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='triangle';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(130,t+.035);g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+.045);o.connect(g);g.connect(audio.destination);o.start();o.stop(t+.05)}
function poly(vertices,fill,stroke){ctx.beginPath();vertices.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function paint(now){ctx.setTransform(canvas.width/W,0,0,canvas.height/viewH,0,0);ctx.clearRect(0,0,W,viewH);ctx.save();const sy=Math.min(1,(viewH-105)/H),oy=(viewH-H*sy)/2+22;ctx.translate(0,oy);ctx.scale(1,sy);
ctx.fillStyle='#b27c4826';for(let x=30;x<W;x+=35)for(let y=20;y<H;y+=35){ctx.beginPath();ctx.arc(x,y,1.2,0,7);ctx.fill()}
if(points.length){ctx.beginPath();points.forEach((p,i)=>i&&points[i-1].group===p.group?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='#bb875638';ctx.lineWidth=3;ctx.setLineDash([3,9]);ctx.stroke();ctx.setLineDash([])}
const elapsed=running?now-start:completed?1e9:-1e9;let count=0;
points.forEach((p,i)=>{const next=points[i+1]?.group===p.group?points[i+1]:p,prev=points[i-1]?.group===p.group?points[i-1]:p;let angle=Math.atan2(next.y-prev.y,next.x-prev.x);let f=Math.max(0,Math.min(1,(elapsed-p.step*delay)/240));if(f>=1)count++;let a=f*Math.PI/2,dx=Math.cos(angle)*Math.sin(a)*37,dy=Math.sin(angle)*Math.sin(a)*37,z=Math.cos(a)*37;
const nx=-Math.sin(angle)*10,ny=Math.cos(angle)*10,tx=Math.cos(angle)*3.5,ty=Math.sin(angle)*3.5;
let b=[p.x,p.y],top=[p.x+dx,p.y+dy-z];const v=(c,n,t)=>[c[0]+nx*n+tx*t,c[1]+ny*n+ty*t];
ctx.beginPath();ctx.ellipse(p.x+dx*.45+6,p.y+dy*.45+5,11+Math.abs(dx)*.35,5,angle,0,7);ctx.fillStyle='#7745241c';ctx.fill();
poly([v(b,-1,1),v(b,1,1),v(top,1,1),v(top,-1,1)],i===0?'#f0d7ab':'#fdfbf2','#bda58b');poly([v(b,1,1),v(b,1,-1),v(top,1,-1),v(top,1,1)],'#d2bda2','#aa8a68');poly([v(top,-1,-1),v(top,1,-1),v(top,1,1),v(top,-1,1)],'#fffef7','#bda58b');
if(i===0&& !running&&!completed){ctx.fillStyle='#985535';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText('↓ Push me',p.x,p.y-53)}
});ctx.restore();if(running){const idx=Math.min(points.length-1,Math.floor(elapsed/delay));if(idx!==lastSound){lastSound=idx;clickSound()}statusEl.textContent=count+' / '+points.length+' down';if(elapsed>Math.max(0,...paths.map(path=>path.length-1))*delay+260){running=false;completed=true;update()}}}
function loc(e){const r=canvas.getBoundingClientRect(),sy=Math.min(1,(viewH-105)/H),oy=(viewH-H*sy)/2+22;return{x:Math.max(35,Math.min(965,(e.clientX-r.left)/r.width*W)),y:Math.max(65,Math.min(H-30,((e.clientY-r.top)/r.height*viewH-oy)/sy))}}
canvas.addEventListener('pointerdown',e=>{if(running||dragging)return;if(!drawing){push();return}if(points.length>=600||paths.length>=60)return;e.preventDefault();stop();canvas.setPointerCapture(e.pointerId);pointer=e.pointerId;dragging=true;raw=[loc(e)];paths.push(resample(raw));rebuild()});canvas.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==pointer||running)return;e.preventDefault();let p=loc(e);if(Math.hypot(p.x-raw.at(-1).x,p.y-raw.at(-1).y)>3&&raw.length<4000){raw.push(p);const available=600-paths.slice(0,-1).reduce((sum,path)=>sum+path.length,0);paths[paths.length-1]=resample(raw).slice(0,available);rebuild()}});function end(e){if(e.pointerId!==pointer)return;dragging=false;pointer=null;update()}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',end);
btn.undo.onclick=()=>{if(running||dragging)return;stop();paths.pop();rebuild()};btn.clear.onclick=()=>{stop();paths=[];raw=[];drawing=true;sync();rebuild()};
btn.push.onclick=push;btn.reset.onclick=()=>{stop();update()};btn.twist.onclick=()=>{variant++;preset()};btn.draw.onclick=()=>{stop();drawing=!drawing;sync();update()};btn.sound.onclick=()=>{soundOn=!soundOn;if(soundOn)initAudio();btn.sound.textContent='Sound: '+(soundOn?'On':'Off');btn.sound.setAttribute('aria-pressed',soundOn)};document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){stop();update()}});function frame(t){paint(t);requestAnimationFrame(frame)}preset();fit();requestAnimationFrame(frame);
</script><script src="../../analytics/config.js"></script><script src="../../analytics/analytics.js"></script></body></html>
