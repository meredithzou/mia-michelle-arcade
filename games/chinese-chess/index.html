<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Chess (中国象棋) | Mia and Michelle’s Arcade</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e5;color:#373d36;font-family:system-ui,-apple-system,sans-serif;text-align:center}main{max-width:650px;margin:auto;padding:16px}a{color:inherit;text-decoration:none}small{display:block;letter-spacing:3px;color:#7c876c;margin-top:15px}h1{font-family:serif;font-size:31px;margin:8px}p{font-size:14px;color:#7a7c6f;margin:8px}#status{font-weight:700;font-size:18px;margin:17px}#wrap{border:8px solid #b58a58;border-radius:14px;background:#efd4a6;box-shadow:0 8px 25px #5c472422;overflow:hidden}svg{display:block;width:100%;touch-action:manipulation;user-select:none}button{background:#fffaf1;border:1px solid #c8c5b5;border-radius:20px;padding:11px 19px;font:inherit;color:inherit;cursor:pointer;margin:13px 4px}button:disabled{opacity:.4}details{text-align:left;font-size:14px;line-height:1.8;background:#fff8;padding:12px 18px;border-radius:15px;margin:12px 0}#captures{font-size:14px;min-height:24px}.piece{cursor:pointer}.piece text{pointer-events:none;font-family:serif;font-weight:bold}footer{font-size:12px;color:#888;margin:15px}.undo-icon{display:inline-block;width:20px;height:20px;vertical-align:-4px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}button:focus-visible{outline:3px solid #68885c;outline-offset:3px}</style><link rel="stylesheet" href="../../shared/arcade-nav.css"><body class="arcade-game-page" style="--arcade-return-bg:#8b633c;--arcade-return-focus:#b58a58"><a class="arcade-return" href="../../index.html">← Mia and Michelle’s Arcade</a><main><h1>中国象棋</h1><p>一盘棋，两个人 · Chinese Chess</p><div id="status" aria-live="polite"></div><div id="wrap"><svg id="board" viewBox="0 0 540 600" role="img" aria-label="中国象棋棋盘"></svg></div><p id="hint">点一下棋子，再点绿色圆点落子</p><div id="captures"></div><button id="undo"><svg class="undo-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg> 悔棋</button><button id="flip">⇅ 翻转棋盘</button><button id="reset">重新开局</button><details><summary>怎么玩 · 棋子走法</summary>红方先走，两人轮流点击棋子和落点。绿色圆点表示可以走的位置。<br>车走直线；马走日，注意蹩马腿；相走田，不能过河，也不能塞象眼；仕斜走一步，限九宫；帅每次直走一步，限九宫。<br>炮移动像车，吃子必须隔一个棋子；兵向前一步，过河后可以横走，不能后退。双方将帅不能直接照面。<br>被将军时必须解将。无合法走法的一方输棋。本游戏不自动判定长将、长捉与重复局面，可双方商定和棋。</details><footer>Mia & Michelle’s Arcade · 双人同屏</footer></main><script>
const S=document.getElementById('board'),NS='http://www.w3.org/2000/svg';let b,turn='r',sel=null,history=[],last=null,over=false,flipped=false;
const names={r:{k:'帅',a:'仕',e:'相',h:'马',r:'车',c:'炮',p:'兵'},b:{k:'将',a:'士',e:'象',h:'马',r:'车',c:'炮',p:'卒'}};
function initial(){b=Array.from({length:10},()=>Array(9).fill(null));['r','h','e','a','k','a','e','h','r'].forEach((t,x)=>{b[0][x]={s:'b',t};b[9][x]={s:'r',t}});for(let x of [1,7]){b[2][x]={s:'b',t:'c'};b[7][x]={s:'r',t:'c'}}for(let x of [0,2,4,6,8]){b[3][x]={s:'b',t:'p'};b[6][x]={s:'r',t:'p'}}turn='r';sel=null;history=[];last=null;over=false;render()}
function inside(x,y){return x>=0&&x<9&&y>=0&&y<10}function palace(s,x,y){return x>=3&&x<=5&&(s==='r'?y>=7&&y<=9:y>=0&&y<=2)}
function raw(x,y,X,Y){let p=b[y][x],q=b[Y][X];if(!p||(q&&q.s===p.s)||(x===X&&y===Y))return false;let dx=X-x,dy=Y-y,ax=Math.abs(dx),ay=Math.abs(dy),n=0;if(dx===0||dy===0){let steps=Math.max(ax,ay);for(let i=1;i<steps;i++)if(b[y+Math.sign(dy)*i][x+Math.sign(dx)*i])n++}switch(p.t){case'r':return(dx===0||dy===0)&&n===0;case'c':return(dx===0||dy===0)&&n===(q?1:0);case'h':return ax===2&&ay===1?!b[y][x+Math.sign(dx)]:ax===1&&ay===2?!b[y+Math.sign(dy)][x]:false;case'e':return ax===2&&ay===2&&(p.s==='r'?Y>=5:Y<=4)&&!b[y+dy/2][x+dx/2];case'a':return ax===1&&ay===1&&palace(p.s,X,Y);case'k':return q&&q.t==='k'&&dx===0&&n===0||ax+ay===1&&palace(p.s,X,Y);case'p':return dx===0&&dy===(p.s==='r'?-1:1)||ay===0&&ax===1&&(p.s==='r'?y<=4:y>=5)}}
function check(s){let k;for(let y=0;y<10;y++)for(let x=0;x<9;x++)if(b[y][x]?.s===s&&b[y][x].t==='k')k=[x,y];if(!k)return true;for(let y=0;y<10;y++)for(let x=0;x<9;x++)if(b[y][x]&&b[y][x].s!==s&&raw(x,y,...k))return true;return false}
function legal(x,y,X,Y){if(!inside(X,Y)||!raw(x,y,X,Y))return false;let p=b[y][x],q=b[Y][X];b[Y][X]=p;b[y][x]=null;let ok=!check(p.s);b[y][x]=p;b[Y][X]=q;return ok}function moves(x,y){let a=[];for(let Y=0;Y<10;Y++)for(let X=0;X<9;X++)if(legal(x,y,X,Y))a.push([X,Y]);return a}function hasMoves(s){for(let y=0;y<10;y++)for(let x=0;x<9;x++)if(b[y][x]?.s===s&&moves(x,y).length)return true;return false}
function el(tag,attrs,text){let e=document.createElementNS(NS,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);if(text)e.textContent=text;S.appendChild(e);return e}function pos(x,y){return[30+(flipped?8-x:x)*60,30+(flipped?9-y:y)*60]}
function render(){S.replaceChildren();for(let y=0;y<10;y++)el('line',{x1:30,y1:30+y*60,x2:510,y2:30+y*60,stroke:'#9a7447','stroke-width':1.5});for(let x=0;x<9;x++){for(let pair of(x===0||x===8?[[0,9]]:[[0,4],[5,9]]))el('line',{x1:30+x*60,y1:30+pair[0]*60,x2:30+x*60,y2:30+pair[1]*60,stroke:'#9a7447','stroke-width':1.5})}for(let y of [0,7]){el('path',{d:`M210 ${30+y*60} L330 ${150+y*60} M330 ${30+y*60} L210 ${150+y*60}`,stroke:'#9a7447',fill:'none'})}el('text',{x:150,y:307,'text-anchor':'middle','font-size':28,fill:'#9a7447','font-family':'serif'},'楚 河');el('text',{x:390,y:307,'text-anchor':'middle','font-size':28,fill:'#9a7447','font-family':'serif'},'汉 界');if(last)for(let p of last){let [cx,cy]=pos(...p);el('rect',{x:cx-27,y:cy-27,width:54,height:54,rx:9,fill:'#bd9a4144'})}let targets=sel?moves(...sel):[];for(let y=0;y<10;y++)for(let x=0;x<9;x++){let p=b[y][x];if(!p)continue;let [cx,cy]=pos(x,y),selected=sel&&sel[0]===x&&sel[1]===y;let g=el('g',{class:'piece',role:'button','aria-label':(p.s==='r'?'红':'黑')+names[p.s][p.t]});let c=document.createElementNS(NS,'circle');Object.entries({cx,cy:cy+3,r:25,fill:'#6f502e44'}).forEach(([k,v])=>c.setAttribute(k,v));g.append(c);let c2=c.cloneNode();Object.entries({cy,r:25,fill:selected?'#fff7d4':'#fff0d1',stroke:selected?'#68885c':'#b28c55','stroke-width':selected?4:2}).forEach(([k,v])=>c2.setAttribute(k,v));g.append(c2);let t=document.createElementNS(NS,'text');Object.entries({x:cx,y:cy+11,'text-anchor':'middle','font-size':32,fill:p.s==='r'?'#b33e35':'#313e42'}).forEach(([k,v])=>t.setAttribute(k,v));t.textContent=names[p.s][p.t];g.append(t)}for(let [x,y]of targets){let[cx,cy]=pos(x,y);el('circle',{cx,cy,r:b[y][x]?27:8,fill:b[y][x]?'none':'#638a5b',stroke:'#638a5b','stroke-width':4})}document.getElementById('status').textContent=over?`${turn==='r'?'黑方':'红方'}获胜！ 🎉`:`${turn==='r'?'🔴 红方':'⚫ 黑方'}走棋${check(turn)?' · 将军！':''}`;document.getElementById('undo').disabled=!history.length;document.getElementById('captures').textContent=history.length?`已走 ${history.length} 步`: '红方先走 · 两人轮流';}
S.addEventListener('click',e=>{if(over)return;let r=S.getBoundingClientRect(),X=Math.round(((e.clientX-r.left)*540/r.width-30)/60),Y=Math.round(((e.clientY-r.top)*600/r.height-30)/60);if(flipped){X=8-X;Y=9-Y}if(!inside(X,Y))return;if(b[Y][X]?.s===turn){sel=sel&&sel[0]===X&&sel[1]===Y?null:[X,Y];render();return}if(sel&&legal(...sel,X,Y)){history.push({b:JSON.stringify(b),turn,last});let[x,y]=sel;b[Y][X]=b[y][x];b[y][x]=null;last=[[x,y],[X,Y]];turn=turn==='r'?'b':'r';sel=null;over=!hasMoves(turn);render()}});document.getElementById('undo').onclick=()=>{let h=history.pop();if(!h)return;b=JSON.parse(h.b);turn=h.turn;last=h.last;sel=null;over=false;render()};document.getElementById('reset').onclick=()=>{if(!history.length||confirm('重新开一盘？'))initial()};document.getElementById('flip').onclick=()=>{flipped=!flipped;render()};initial();
</script><script src="../../analytics/config.js"></script><script src="../../analytics/analytics.js"></script></body></html>
