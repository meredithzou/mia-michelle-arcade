 };
 let language='zh';
 try{const saved=localStorage.getItem('cc-v17-language');if(['zh','en','es'].includes(saved))language=saved;}catch(e){}
 const T=()=>TEXT[language];
 const savePref=(k,v)=>{try{localStorage.setItem('cc-v17-'+k,v);}catch(e){}};

 const TURN_ARMS={2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4],6:[0,1,2,3,4,5]};
 const DIRS=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
 const SPACING=39,CX=330,CY=357;
 const key=(q,r)=>q+','+r,rot=([q,r])=>[-r,q+r];
 const cells=new Map(),camps=Array.from({length:6},()=>[]);
 for(let q=-4;q<=4;q++)for(let r=-4;r<=4;r++)if(Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))<=4)cells.set(key(q,r),{q,r,arm:-1});
 for(let arm=0;arm<6;arm++)for(let d=1;d<=4;d++)for(let q=d;q<=4;q++){
   let [x,y]=[q,-4-d];for(let k=0;k<arm;k++)[x,y]=rot([x,y]);
   const k=key(x,y);camps[arm].push(k);cells.set(k,{q:x,r:y,arm});
 }
 const position=(q,r)=>[CX+(q+r/2)*SPACING,CY+r*SPACING*Math.sqrt(3)/2];
 let count=2,rule='long',players=[],turnIndex=0,occupied=new Map(),selected=null,chain=[],winner=null;
 let cfgCount=2,cfgRule='long',sound=true,hints=true,audioCtx=null;
 try{hints=localStorage.getItem('cc-v17-hints')!=='off';sound=localStorage.getItem('cc-v17-sound')!=='off';const savedCount=Number(localStorage.getItem('cc-v17-player-count'));const savedRule=localStorage.getItem('cc-v17-jump-rule');if(savedCount>=2&&savedCount<=6)cfgCount=savedCount;if(savedRule==='short'||savedRule==='long')cfgRule=savedRule;}catch(e){}
 const current=()=>players[turnIndex],isOccupied=k=>occupied.has(k);
 const countArrived=arm=>camps[(arm+3)%6].filter(k=>occupied.get(k)===arm).length;
 function init(n=2,r='long'){
   count=n;rule=r;players=TURN_ARMS[count].map(arm=>({arm}));turnIndex=0;selected=null;chain=[];winner=null;occupied=new Map();
   for(const p of players)for(const k of camps[p.arm])occupied.set(k,p.arm);
   closeModal();render();
 }
 function legal(from,onlyHops=false){
   const cell=cells.get(from),opts=new Map();if(!cell)return opts;
   for(const [dq,dr] of DIRS){
     if(!onlyHops){const to=key(cell.q+dq,cell.r+dr);if(cells.has(to)&&!isOccupied(to))opts.set(to,'step');}
     for(let dist=1;dist<=8;dist++){
       const mid=key(cell.q+dist*dq,cell.r+dist*dr);if(!cells.has(mid))break;
       if(isOccupied(mid)){
         if(rule==='short'&&dist!==1)break;
         const to=key(cell.q+2*dist*dq,cell.r+2*dist*dr);
         if(!cells.has(to)||isOccupied(to))break;
         let clear=true;
         for(let j=dist+1;j<dist*2;j++)if(!cells.has(key(cell.q+j*dq,cell.r+j*dr))||isOccupied(key(cell.q+j*dq,cell.r+j*dr))){clear=false;break;}
         if(clear)opts.set(to,'hop');break;
       }
       if(rule==='short')break;
     }
   }
   if(chain.length){const visited=new Set([chain[0].from,...chain.map(h=>h.to)]);for(const k of opts.keys())if(visited.has(k))opts.delete(k);}
   return opts;
 }
 function tap(k){
   if(winner!==null||!overlay.hidden)return;
   const arm=current().arm,piece=occupied.get(k);
   if(selected===null){if(piece===arm){selected=k;render();}return;}
   // Quiet tap-to-pass. Never skip a player's turn, even if a non-next color is tapped.
   if(chain.length>0&&piece!==undefined&&piece!==arm){finish(k);return;}
   if(k===selected){if(chain.length>0)finish();else{selected=null;render();}return;}
   if(chain.length===0&&piece===arm){selected=k;render();return;}
   const options=legal(selected,chain.length>0);if(!options.has(k))return;
   const typ=options.get(k),from=selected;
   occupied.delete(from);occupied.set(k,arm);selected=k;playSound(typ,chain.length);
   if(typ==='step'){finish();return;}
   chain.push({from,to:k});
   // A hop without any further legal hops ends automatically.
   // As long as an option exists, the player may still stop voluntarily.
   if(legal(k,true).size===0){finish();return;}
   render();
 }
 function finish(nextPiece=null){
   const arm=current().arm;
   if(countArrived(arm)===10){winner=arm;selected=null;chain=[];render();showWinner();return;}
   turnIndex=(turnIndex+1)%players.length;chain=[];
   selected=nextPiece!==null&&occupied.get(nextPiece)===current().arm?nextPiece:null;
   render();
 }
 function draw(){
   // Exact equilateral six-pointed star. The outer radius comes from the
   // 4-row triangular lattice extent (4*sqrt(3)*SPACING), plus one lattice
   // spacing. This puts every straight edge precisely half a spacing beyond
   // the outside row of board holes, without moving any hole or marble.
   const outerRadius=(4*Math.sqrt(3)+1)*SPACING;
   const innerRadius=outerRadius/Math.sqrt(3);
   const star=[];
   for(let i=0;i<12;i++){
     const angle=(-90+i*30)*Math.PI/180;
     const radius=i%2===0?outerRadius:innerRadius;
     star.push((CX+Math.cos(angle)*radius).toFixed(3)+','+(CY+Math.sin(angle)*radius).toFixed(3));
   }
   const dots=Array.from(cells.entries()).sort((a,b)=>a[1].r-b[1].r||a[1].q-b[1].q);
   const options=selected!==null?legal(selected,chain.length>0):new Map();
   let html='<defs><linearGradient id="cc-preview-bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#edf8ed"/></linearGradient><filter id="cc-preview-shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity=".18"/></filter></defs>';
   html+='<polygon points="'+star.join(' ')+'" fill="url(#cc-preview-bg)" stroke="#d6e5d6" stroke-width="3" stroke-linejoin="round"/>';
   for(const [k,cell] of dots){
     const [x,y]=position(cell.q,cell.r),piece=occupied.get(k),highlight=options.get(k),active=k===selected;
     const base=cell.arm===-1?'#e6eee5':COLORS[cell.arm]+'25';
     html+='<g data-key="'+k+'" aria-label="'+(piece!==undefined?T().color[piece]+T().piece:highlight&&hints?T().landing:T().empty)+'">';
     if(highlight&&hints)html+='<circle cx="'+x+'" cy="'+y+'" r="22" fill="'+(highlight==='hop'?'#fff0b7':'#b9edd0')+'" stroke="'+(highlight==='hop'?'#eba941':'#62b28b')+'" stroke-width="2.3" stroke-dasharray="4 3"/>';
     if(active)html+='<circle cx="'+x+'" cy="'+y+'" r="22" fill="none" stroke="#204936" stroke-width="3.5"/>';
     html+='<circle cx="'+x+'" cy="'+y+'" r="15.5" fill="'+base+'" stroke="'+(cell.arm===-1?'#cadacb':COLORS[cell.arm]+'55')+'" stroke-width="1.2"/>';
     if(piece!==undefined){
       html+='<circle cx="'+x+'" cy="'+y+'" r="14.2" fill="'+COLORS[piece]+'" stroke="#fff9" stroke-width="1.7" filter="url(#cc-preview-shadow)"/>';
       html+='<ellipse cx="'+(x-4.3)+'" cy="'+(y-5.7)+'" rx="5" ry="3.4" fill="white" opacity=".55" transform="rotate(-25 '+(x-4.3)+' '+(y-5.7)+')"/>';
     }else if(highlight&&hints){html+='<circle cx="'+x+'" cy="'+y+'" r="6.8" fill="'+(highlight==='hop'?'#dda43d':'#4baa7d')+'"/>';}
     html+='<circle class="cc-hit" cx="'+x+'" cy="'+y+'" r="19.4"/></g>';
   }
   board.innerHTML=html;
 }
 function render(){
   const t=T(),arm=current().arm;
   root.lang=language==='zh'?'zh-CN':language;
   $('[data-ui="titletext"]').textContent=t.title;
   $('[data-act="help"]').textContent=t.rulesButton;
   $('[data-act="settings"]').textContent=t.settingsButton;
   $('[data-act="newgame"]').textContent=t.newGameButton;
   $('[data-ui="turnlabel"]').textContent=t.turnLabel;
   $('[data-ui="goal"]').textContent=t.goal;
   $('[data-ui="local"]').textContent=t.local;
   board.setAttribute('aria-label',t.boardLabel);
   $('[data-ui="swatch"]').style.setProperty('--turn-color',COLORS[arm]);
   $('[data-ui="player"]').textContent=language==='zh'?t.color[arm]+t.faction+' · '+t.player+' '+(turnIndex+1):t.color[arm]+' · '+t.player+' '+(turnIndex+1);
   $('[data-ui="status"]').textContent=selected===null?(hints?t.startHints:t.startNoHints):chain.length?(hints?t.chainHints:t.chainNoHints):(hints?t.moveHints:t.moveNoHints);
   $('[data-ui="progress"]').innerHTML=players.map((p,i)=>'<span class="cc-chip '+(i===turnIndex?'cc-active':'')+'"><span class="cc-chipdot" style="--chip-color:'+COLORS[p.arm]+'"></span>'+t.color[p.arm]+t.faction+' '+countArrived(p.arm)+'/10</span>').join('');
   draw();
 }
 function playSound(kind,jumps){
   if(!sound)return;
   try{
     const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
     if(!audioCtx)audioCtx=new Ctx();if(audioCtx.state==='suspended')audioCtx.resume();
     const now=audioCtx.currentTime,hop=kind==='hop',freq=(hop?560:420)+Math.min(5,jumps)*65;
     function note(hz,t,d,level){const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=hop?'sine':'triangle';osc.frequency.setValueAtTime(hz,t);osc.frequency.exponentialRampToValueAtTime(hz*.8,t+d);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(level,t+.008);gain.gain.exponentialRampToValueAtTime(.0001,t+d);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+d+.01);}
     note(freq,now,.11,hop?.06:.04);if(hop)note(freq*1.45,now+.04,.09,.03);
   }catch(e){}
 }
 function showModal(html){modal.innerHTML=html;overlay.hidden=false;}
 function closeModal(){overlay.hidden=true;modal.innerHTML='';}
 function settings(){renderSettings();}
 function renderSettings(){
   const t=T();
   showModal('<h2>'+t.settings+'</h2><p>'+t.settingsNote+'</p><div class="cc-section">'+t.preferences+'</div>'+
    '<div class="cc-option"><div><strong>'+t.sound+'</strong><small>'+t.soundSub+'</small></div><button type="button" class="cc-toggle '+(sound?'enabled':'')+'" data-opt="sound" aria-pressed="'+sound+'">'+(sound?t.on:t.off)+'</button></div>'+
    '<div class="cc-option"><div><strong>'+t.hints+'</strong><small>'+t.hintsSub+'</small></div><button type="button" class="cc-toggle '+(hints?'enabled':'')+'" data-opt="hints" aria-pressed="'+hints+'">'+(hints?t.on:t.off)+'</button></div>'+
    '<div class="cc-section">'+t.language+'</div><div class="cc-languages">'+[['zh','中文'],['en','English'],['es','Español']].map(([code,name])=>'<button type="button" data-lang="'+code+'" class="'+(language===code?'cc-choice':'')+'" aria-pressed="'+(language===code)+'">'+name+'</button>').join('')+'</div>'+
    '<hr class="cc-sectionline"><div class="cc-section">'+t.newGame+'</div><strong>'+t.players+'</strong><div class="cc-grid">'+[2,3,4,5,6].map(n=>'<button type="button" data-n="'+n+'" class="'+(cfgCount===n?'cc-choice':'')+'">'+n+'</button>').join('')+'</div><strong>'+t.jumpRule+'</strong><div class="cc-rules"><button type="button" data-r="long" class="'+(cfgRule==='long'?'cc-choice':'')+'">'+t.longDefault+'</button><button type="button" data-r="short" class="'+(cfgRule==='short'?'cc-choice':'')+'">'+t.classic+'</button></div>'+
    '<div class="cc-modalactions"><button type="button" class="cc-primary" data-do="close">'+t.cancel+'</button></div>');
   modal.querySelector('[data-opt="sound"]').onclick=()=>{sound=!sound;savePref('sound',sound?'on':'off');if(sound)playSound('step',0);renderSettings();};
   modal.querySelector('[data-opt="hints"]').onclick=()=>{hints=!hints;savePref('hints',hints?'on':'off');render();renderSettings();};
   modal.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{language=b.dataset.lang;savePref('language',language);render();renderSettings();});
   modal.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{cfgCount=Number(b.dataset.n);savePref('player-count',String(cfgCount));renderSettings();});
   modal.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{cfgRule=b.dataset.r;savePref('jump-rule',cfgRule);renderSettings();});
   modal.querySelector('[data-do="close"]').onclick=closeModal;
 }
 function help(){
   const t=T();
   showModal('<h2>'+t.helpTitle+'</h2><div class="cc-helptext">'+t.help.map(([heading,description])=>'<p><b>'+heading+'：</b>'+description+'</p>').join('')+'</div><div class="cc-modalactions"><button class="cc-go" data-do="close">'+t.helpClose+'</button></div>');
   modal.querySelector('[data-do="close"]').onclick=closeModal;
 }
 function showWinner(){
   const t=T(),arm=winner;
   showModal('<h2 style="text-align:center">'+t.winTitle+'</h2><div class="cc-wintitle" style="color:'+COLORS[arm]+'">🏆 '+t.color[arm]+t.faction+t.wins+'</div><p style="text-align:center">'+t.winBody+'</p><div class="cc-modalactions"><button class="cc-go" data-do="again">'+t.again+'</button><button data-do="change">'+t.change+'</button></div>');
   modal.querySelector('[data-do="again"]').onclick=()=>init(cfgCount,cfgRule);
   modal.querySelector('[data-do="change"]').onclick=settings;
 }
 board.addEventListener('click',e=>{const target=e.target.closest('[data-key]');if(target&&board.contains(target))tap(target.getAttribute('data-key'));});
 $('[data-act="settings"]').addEventListener('click',settings);
 $('[data-act="newgame"]').addEventListener('click',()=>init(cfgCount,cfgRule));
 $('[data-act="help"]').addEventListener('click',help);
 init(cfgCount,cfgRule);
})();
</script>
