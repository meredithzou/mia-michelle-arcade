<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jigsaw Garden | Mia and Michelle's Arcade</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#244e43;font-family:ui-rounded,'Avenir Next',system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:26px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.arcade-nav{max-width:1050px;margin:auto;padding:12px 20px 0}.arcade-nav a{display:inline-block;padding:9px 13px;border-radius:999px;background:#315d4c;color:white;text-decoration:none;font-size:13px}.brand{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#788a74}h1{font-family:Georgia,serif;font-size:42px;font-weight:400;margin:8px 0}p{color:#738377;margin:8px 0 20px}button,.upload,select{font:inherit;border:1px solid #d6ded0;border-radius:12px;background:#fffdf8;color:#31594b;padding:11px 16px;cursor:pointer}button:hover,.upload:hover{background:#e5eddd}button.active{background:#315d4c;color:white;border-color:#315d4c}.controls{position:sticky;top:0;z-index:5;background:#f7f5ef;padding:8px 0;display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:22px 0 16px}.spacer{flex:1}.game{background:#e9eddf;border:1px solid #dbe1d0;border-radius:24px;padding:14px;box-shadow:0 12px 40px #445d4010}canvas{display:block;width:min(100%,max(320px,calc((100svh - 270px)*1.064)));margin:auto;touch-action:none;border-radius:16px}.status{display:flex;justify-content:space-between;padding:7px 10px 14px;font-size:14px}.hint{font-size:13px;text-align:center;margin:14px}#win{display:none;text-align:center;background:#315d4c;color:white;border-radius:18px;padding:20px;margin-top:15px}#win h2{margin:0 0 5px;font-family:Georgia;font-size:30px}#photo{display:none}@media(max-width:600px){main{padding:18px 10px}h1{font-size:32px}header>span{display:none}button,.upload,select{padding:10px 12px}.game{padding:5px}.brand{font-size:10px}}
</style><body><nav class="arcade-nav"><a href="../../index.html">← Mia and Michelle’s Arcade</a></nav><main><header><div><div class="brand">Ming’s Arcade · A little time to play</div><h1>Jigsaw Garden <span style="font-size:28px">✿</span></h1><p>A little piece of a lovely day.</p></div><span style="font-size:45px">🧩</span></header><div class="controls"><select id="scene" aria-label="Picture"><option value="garden">Garden picnic</option><option value="sea">Under the sea</option><option value="space">Cosmic adventure</option></select><button class="active" data-n="3">9 pieces</button><button data-n="4">16 pieces</button><button data-n="5">25 pieces</button><label class="upload" for="photo">＋ Your photo</label><input id="photo" type="file" accept="image/*"><span class="spacer"></span><button id="next">Next puzzle →</button><button id="peek" aria-pressed="false">Peek</button><button id="hint">Hint</button><button id="restart">↻ Restart</button></div><section class="game"><div class="status"><span id="progress" aria-live="polite">0 / 9 pieces</span><span id="time">0:00</span></div><canvas id="c" width="1000" height="940" aria-label="Jigsaw puzzle. Drag pieces onto the board, or tap a piece then tap its place." tabindex="0"></canvas></section><p class="hint">Drag a piece into place, or tap a piece and then its spot. Pieces snap when they’re close.</p><div id="win" role="status"><h2>You put it all together! ✨</h2><div id="result"></div><button style="margin-top:15px" onclick="start()">Play again</button></div></main><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),art=document.createElement('canvas');art.width=640;art.height=448;const a=art.getContext('2d');let scrollTouch=null;let n=3,pieces=[],selected=null,drag=null,peek=false,done=false,startTime=Date.now(),photo=null,scene='garden',hintPiece=null;const bx=180,by=35,W=640,H=448;
function ellipse(x,y,rx,ry,color){a.fillStyle=color;a.beginPath();a.ellipse(x,y,rx,ry,0,0,7);a.fill()}function txt(s,x,y,z){a.font=z+'px serif';a.textAlign='center';a.fillText(s,x,y)}
function artwork(){a.clearRect(0,0,W,H);if(photo){let scale=Math.max(W/photo.width,H/photo.height);a.drawImage(photo,(W-photo.width*scale)/2,(H-photo.height*scale)/2,photo.width*scale,photo.height*scale);return}let g=a.createLinearGradient(0,0,0,H);g.addColorStop(0,scene==='sea'?'#73dbda':scene==='space'?'#202647':'#bce6df');g.addColorStop(1,scene==='sea'?'#087e9a':scene==='space'?'#725c9c':'#f8e5ab');a.fillStyle=g;a.fillRect(0,0,W,H);if(scene==='garden'){ellipse(520,78,43,43,'#fff0ae');ellipse(145,290,330,110,'#a8c28c');ellipse(515,330,380,130,'#799e75');a.fillStyle='#f5c6a6';a.beginPath();a.moveTo(180,305);a.lineTo(435,305);a.lineTo(500,425);a.lineTo(110,425);a.fill();a.strokeStyle='#fff3d6';a.lineWidth=3;for(let i=0;i<8;i++){a.beginPath();a.moveTo(160+i*40,310);a.lineTo(115+i*54,425);a.stroke()}for(let y=325;y<430;y+=24){a.beginPath();a.moveTo(120,y);a.lineTo(490,y);a.stroke()}txt('🧺',310,350,65);txt('🍓',240,387,43);txt('🍰',377,390,48);txt('🦋',390,130,49);txt('🐇',110,300,70);txt('🌳',72,213,145);txt('🌳',585,262,130);for(let i=0;i<15;i++)txt(['🌼','🌷','🌸'][i%3],25+(i*83)%600,365+(i*37)%80,30);txt('☁️',210,87,85)}else if(scene==='sea'){for(let i=0;i<18;i++){a.strokeStyle='#c6ffff88';a.lineWidth=2;a.beginPath();a.arc(20+(i*97)%620,20+(i*71)%400,5+i%5,0,7);a.stroke()}a.fillStyle='#e9d6a4';a.beginPath();a.moveTo(0,395);a.quadraticCurveTo(300,340,640,395);a.lineTo(640,448);a.lineTo(0,448);a.fill();[['🐢',150,125,86],['🐠',410,180,93],['🐙',270,320,90],['🐟',540,95,65],['🪸',75,426,85],['🐚',500,423,55],['🌿',590,390,80]].forEach(x=>txt(...x))}else{for(let i=0;i<70;i++){ellipse((i*139)%640,(i*73)%448,i%3+1,i%3+1,'#fff3d0')}ellipse(490,110,65,65,'#dbac91');a.save();a.translate(490,110);a.rotate(-.4);a.strokeStyle='#f4d8a8';a.lineWidth=15;a.beginPath();a.ellipse(0,0,105,20,0,0,7);a.stroke();a.restore();txt('🚀',230,245,125);txt('🌎',100,390,110);txt('🛸',480,355,85);txt('☄️',110,100,65)}}
function edge(p,x,y,dx,dy,sign){const pt=(t,b)=>[x+dx*t-dy*b,y+dy*t+dx*b];let v=pt(.35,0);p.lineTo(...v);if(sign){p.bezierCurveTo(...pt(.42,0),...pt(.36,.18*sign),...pt(.5,.18*sign));p.bezierCurveTo(...pt(.64,.18*sign),...pt(.58,0),...pt(.65,0))}p.lineTo(x+dx,y+dy)}
function start(){artwork();done=false;selected=null;drag=null;hintPiece=null;startTime=Date.now();document.getElementById('win').style.display='none';pieces=[];let w=W/n,h=H/n;const hor=Array.from({length:n-1},()=>Array.from({length:n},()=>Math.random()<.5?-1:1)),ver=Array.from({length:n},()=>Array.from({length:n-1},()=>Math.random()<.5?-1:1));let order=Array.from({length:n*n},(_,i)=>i).sort(()=>Math.random()-.5);for(let r=0;r<n;r++)for(let col=0;col<n;col++){let p=new Path2D();p.moveTo(0,0);edge(p,0,0,w,0,r?-hor[r-1][col]:0);edge(p,w,0,0,h,col<n-1?ver[r][col]:0);edge(p,w,h,-w,0,r<n-1?hor[r][col]:0);edge(p,0,h,0,-h,col?-ver[r][col-1]:0);p.closePath();let slot=order[r*n+col],s=Math.min(150/w,(270/n)/h);pieces.push({r,col,path:p,x:(slot%n)*(940/n)+55,y:580+Math.floor(slot/n)*(330/n),s,home:false});}render()}
function drawPiece(p){ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.s,p.s);ctx.shadowColor='#35514340';ctx.shadowBlur=p.home?0:8;ctx.fillStyle='#fff';ctx.fill(p.path);ctx.shadowBlur=0;ctx.save();ctx.clip(p.path);ctx.drawImage(art,-p.col*W/n,-p.r*H/n);ctx.restore();ctx.strokeStyle=p===selected?'#f5b638':p===hintPiece?'#fff173':p.home?'#ffffff50':'#fffdf0';ctx.lineWidth=(p===selected||p===hintPiece?5:2)/p.s;ctx.stroke(p.path);ctx.restore()}
function render(){ctx.clearRect(0,0,1000,940);ctx.fillStyle='#d9dfce';ctx.fillRect(bx-9,by-9,W+18,H+18);ctx.fillStyle='#f8f7ed';ctx.fillRect(bx,by,W,H);ctx.save();ctx.globalAlpha=peek?.7:.07;ctx.drawImage(art,bx,by);ctx.restore();ctx.strokeStyle='#bfcbb855';ctx.lineWidth=1;for(let i=1;i<n;i++){ctx.beginPath();ctx.moveTo(bx+i*W/n,by);ctx.lineTo(bx+i*W/n,by+H);ctx.moveTo(bx,by+i*H/n);ctx.lineTo(bx+W,by+i*H/n);ctx.stroke()}ctx.fillStyle='#83917d';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('YOUR PIECES',500,535);pieces.filter(p=>p.home).forEach(drawPiece);pieces.filter(p=>!p.home&&p!==selected).forEach(drawPiece);if(selected)drawPiece(selected);let count=pieces.filter(p=>p.home).length;document.getElementById('progress').textContent=count+' / '+n*n+' pieces';if(count===n*n&&!done){done=true;document.getElementById('win').style.display='block';document.getElementById('result').textContent='Every piece found its place. Beautifully done!';for(let i=0;i<80;i++){ctx.fillStyle=['#e6b354','#dd8f88','#648e76'][i%3];ctx.fillRect(Math.random()*1000,Math.random()*500,7,12)}}}
function pos(e){let b=c.getBoundingClientRect();return {x:(e.clientX-b.left)*1000/b.width,y:(e.clientY-b.top)*940/b.height}}function hit(q){return [...pieces].reverse().find(p=>!p.home&&ctx.isPointInPath(p.path,(q.x-p.x)/p.s,(q.y-p.y)/p.s))}function place(p,x,y){let tx=bx+p.col*W/n,ty=by+p.r*H/n;if(Math.hypot(x-tx,y-ty)<Math.min(W/n,H/n)*.52){p.x=tx;p.y=ty;p.s=1;p.home=true;selected=null;hintPiece=null;return true}return false}
c.onpointerdown=e=>{let q=pos(e),p=hit(q);if(!p&&!selected){scrollTouch={y:e.clientY};return}e.preventDefault();if(!p&&selected){place(selected,q.x-W/n/2,q.y-H/n/2);render();return}if(p){selected=p;drag={p,px:q.x,py:q.y,ox:p.x,oy:p.y,scale:p.s,moved:false};c.setPointerCapture(e.pointerId);render()}};c.onpointermove=e=>{if(scrollTouch){window.scrollBy(0,scrollTouch.y-e.clientY);scrollTouch.y=e.clientY;return}if(!drag)return;let q=pos(e);if(Math.hypot(q.x-drag.px,q.y-drag.py)>6)drag.moved=true;if(drag.moved){drag.p.s=1;drag.p.x=q.x-W/n/2;drag.p.y=q.y-H/n/2;render()}};c.onpointerup=e=>{scrollTouch=null;if(!drag)return;let d=drag;drag=null;if(d.moved&&!place(d.p,d.p.x,d.p.y)){d.p.x=d.ox;d.p.y=d.oy;d.p.s=d.scale}render()};c.onpointercancel=()=>{scrollTouch=null;if(drag){drag.p.x=drag.ox;drag.p.y=drag.oy;drag.p.s=drag.scale;drag=null;render()}};
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{n=+b.dataset.n;document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('active',x===b));start()});document.getElementById('scene').onchange=e=>{scene=e.target.value;photo=null;start()};document.getElementById('restart').onclick=start;document.getElementById('next').onclick=()=>{const scenes=['garden','sea','space'];scene=scenes[(scenes.indexOf(scene)+1)%scenes.length];photo=null;document.getElementById('scene').value=scene;start()};document.getElementById('peek').onclick=e=>{peek=!peek;e.target.classList.toggle('active',peek);e.target.setAttribute('aria-pressed',peek);render()};document.getElementById('hint').onclick=()=>{let p=selected||pieces.find(p=>!p.home);if(!p)return;hintPiece=p;selected=p;render();ctx.strokeStyle='#d4a038';ctx.lineWidth=5;ctx.strokeRect(bx+p.col*W/n,by+p.r*H/n,W/n,H/n)};document.getElementById('photo').onchange=e=>{let file=e.target.files[0];if(!file)return;let url=URL.createObjectURL(file),im=new Image();im.onload=()=>{photo=im;URL.revokeObjectURL(url);start()};im.onerror=()=>{URL.revokeObjectURL(url);alert('Please choose another photo.')};im.src=url};setInterval(()=>{if(done)return;let t=Math.floor((Date.now()-startTime)/1000);document.getElementById('time').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')},1000);start();
</script><script src="../../analytics/config.js"></script><script src="../../analytics/analytics.js"></script></body></html>
