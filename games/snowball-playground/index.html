*{box-sizing:border-box}body{margin:0;background:#e9f4fb;color:#244660;font:16px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:20px}a{color:inherit;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}h1{margin:0;font-size:clamp(25px,4vw,40px);letter-spacing:-1px}p{margin:7px 0;color:#53748a}.score{background:white;border-radius:20px;padding:12px 20px;font-weight:800;white-space:nowrap}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}button{font:inherit;font-weight:700;color:#34546a;background:#fff;border:1px solid #c5dce9;border-radius:16px;padding:12px 17px;cursor:pointer;touch-action:manipulation}button[aria-pressed=true]{background:#315c7b;color:white;border-color:#315c7b}button:focus-visible,a:focus-visible{outline:3px solid #e7ab41;outline-offset:3px}.stage{position:relative;border:5px solid white;border-radius:27px;overflow:hidden;box-shadow:0 12px 30px #61839d22;background:#cde5f5}canvas{width:100%;display:block;aspect-ratio:5/3;touch-action:none;cursor:crosshair}.hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;pointer-events:none;font-size:clamp(11px,2vw,15px);font-weight:700;color:#4e7089}.controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:15px;margin:20px 0}.pack{background:#478eae;color:white;border:none;min-width:210px;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 5px 0 #286780}.pack:active{transform:translateY(3px);box-shadow:0 2px 0 #286780}.small{font-size:13px;text-align:center}#status{height:24px;text-align:center;font-weight:700;color:#2e657d}@media(max-width:600px){main{padding:12px}header{align-items:flex-start}.score{padding:10px;font-size:13px}button{padding:10px 12px;font-size:14px}.toolbar{gap:6px}canvas{aspect-ratio:1/1}.hint{bottom:7px}.controls{margin:15px 0;gap:10px}}
</style><link rel="stylesheet" href="../../shared/arcade-nav.css?v=6af3b9ba5701"></head><body class="arcade-game-page" style="--arcade-return-bg:#315c7b"><a class="arcade-return" href="../../index.html">← Mia and Michelle’s Arcade</a><main><header><div><h1>❄️ Snowball Playground</h1><p>A little snow. A big SPLAT.</p></div><div class="score">Hits <span id="hits">0</span> · Throws <span id="throws">0</span></div></header><div class="toolbar" aria-label="Choose your playground"><button aria-pressed="true" data-mode="snowman">Snowman</button><button aria-pressed="false" data-mode="targets">Target practice</button><button aria-pressed="false" data-mode="wall">Brick wall</button><button id="reset">↻ Fresh snow</button></div><div class="stage"><canvas id="game" aria-label="Snowball throwing playground. Tap anywhere to throw a snowball there."></canvas><div class="hint">Tap anywhere to throw · Or drag from your snowball and release</div></div><div class="controls"><button class="pack" id="pack">Hold to pack a snowball</button><span id="size">Small & fluffy</span></div><div id="status" aria-live="polite">Your snowball is ready!</div><p class="small">Hold to make it bigger, then tap the wall or a target. Unlimited snow!</p></main><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let mode='snowman',radius=16,packing=false,drag=null,balls=[],marks=[],particles=[],hits=0,throws=0,last=0,t=0;const origin={x:500,y:510};const flakes=Array.from({length:60},()=>({x:Math.random()*1000,y:Math.random()*600,r:Math.random()*2+1,v:Math.random()*16+8}));
function resize(){let r=c.getBoundingClientRect();c.width=Math.round(r.width*devicePixelRatio);c.height=Math.round(r.height*devicePixelRatio)}new ResizeObserver(resize).observe(c);function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*1000,y:(e.clientY-r.top)/r.height*600}}function circle(x,y,r,col){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=col;ctx.fill()}function round(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function label(s,x,y,size=20,col='#41617a'){ctx.font=`700 ${size}px system-ui`;ctx.textAlign='center';ctx.fillStyle=col;ctx.fillText(s,x,y)}
function targetAt(x,y){if(mode==='wall')return x>160&&x<840&&y>155&&y<390;if(mode==='targets')return [270,500,730].some((cx,i)=>Math.hypot(x-cx,y-[270,215,270][i])<62);return Math.hypot(x-500,(y-320)*.9)<105||Math.hypot(x-500,y-210)<66}
function shoot(p){let x=Math.max(20,Math.min(980,p.x)),y=Math.max(45,Math.min(460,p.y));let duration=.65+radius*.004;balls.push({age:0,duration,x,y,r:radius});throws++;$('throws').textContent=throws;radius=16;$('size').textContent='Small & fluffy';$('status').textContent='Snowball away!'}
c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);drag={start:point(e),end:point(e)}};c.onpointermove=e=>{if(drag)drag.end=point(e)};c.onpointerup=e=>{if(drag){shoot(point(e));drag=null}};c.onpointercancel=()=>drag=null;
$('pack').onpointerdown=e=>{e.preventDefault();$('pack').setPointerCapture(e.pointerId);packing=true};function stop(){packing=false} $('pack').onpointerup=stop;$('pack').onpointercancel=stop;
function fresh(){balls=[];marks=[];particles=[];hits=throws=0;radius=16;$('hits').textContent='0';$('throws').textContent='0';$('size').textContent='Small & fluffy';$('status').textContent='Fresh snow. Ready to throw!'}$('reset').onclick=fresh;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));fresh()});
function impact(b){let hit=targetAt(b.x,b.y);if(hit){hits++;$('hits').textContent=hits}marks.push({x:b.x,y:b.y,r:b.r*1.4,life:1,hit});if(marks.length>45)marks.shift();for(let i=0;i<20;i++){let a=Math.random()*Math.PI*2,s=45+Math.random()*160;particles.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,age:0,r:2+Math.random()*5})}$('status').textContent=hit?['SPLAT! Perfect snowy hit!','Powder power!','That was a big splat!'][Math.floor(Math.random()*3)]:'Poof! Snow everywhere.'}
function draw(dt){t+=dt;ctx.setTransform(c.width/1000,0,0,c.height/600,0,0);let sky=ctx.createLinearGradient(0,0,0,600);sky.addColorStop(0,'#b9d8ee');sky.addColorStop(1,'#eef8ff');ctx.fillStyle=sky;ctx.fillRect(0,0,1000,600);ctx.fillStyle='#e4f0f9';ctx.beginPath();ctx.moveTo(0,380);ctx.lineTo(160,145);ctx.lineTo(340,380);ctx.lineTo(630,100);ctx.lineTo(900,390);ctx.lineTo(1000,240);ctx.lineTo(1000,600);ctx.lineTo(0,600);ctx.fill();circle(500,1050,670,'#f6fbff');for(let x of [55,110,900,955]){ctx.fillStyle='#739ca9';ctx.beginPath();ctx.moveTo(x,235);ctx.lineTo(x-45,390);ctx.lineTo(x+45,390);ctx.fill();round(x-4,370,8,45,2,'#8c929b')}
if(mode==='wall'){round(155,155,690,242,12,'#7899ad');ctx.save();ctx.beginPath();ctx.rect(160,160,680,230);ctx.clip();for(let row=0;row<6;row++)for(let col=-1;col<8;col++)round(165+col*100+(row%2)*50,162+row*39,94,33,5,row%2?'#91afc0':'#a1bdcc');ctx.restore();round(147,145,706,19,9,'#fff');label('THE SPLAT WALL',500,127,19)}
if(mode==='targets'){[270,500,730].forEach((x,i)=>{let y=[270,215,270][i];round(x-6,y,12,230,4,'#8fa1ad');circle(x,y,64,'#f8ffff');circle(x,y,49,'#ec8d86');circle(x,y,33,'#fff');circle(x,y,17,'#ec8d86')});label('AIM FOR THE MIDDLE',500,115,19)}
if(mode==='snowman'){ctx.strokeStyle='#8f7864';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(430,300);ctx.lineTo(350,245);ctx.moveTo(570,300);ctx.lineTo(650,245);ctx.stroke();circle(500,344,102,'#d2e6ef');circle(500,335,99,'white');circle(500,213,64,'white');circle(478,204,6,'#324c61');circle(522,204,6,'#324c61');ctx.fillStyle='#efab65';ctx.beginPath();ctx.moveTo(500,215);ctx.lineTo(544,225);ctx.lineTo(500,229);ctx.fill();[280,320,360].forEach(y=>circle(500,y,7,'#597085'));round(440,143,120,14,5,'#3e5e76');round(461,94,78,55,8,'#3e5e76');round(441,254,117,17,5,'#e59791');round(527,259,20,50,5,'#e59791');label('A SNOWY HELLO!',500,69,19)}
marks.forEach(m=>{circle(m.x,m.y,m.r,'#ffffffde');for(let i=0;i<6;i++)circle(m.x+Math.cos(i*2.4)*m.r,m.y+Math.sin(i*2.4)*m.r,m.r*.27,'#ffffffb0')});for(let f of flakes){f.y=(f.y+f.v*dt)%600;circle(f.x+Math.sin(t*.6+f.x)*7,f.y,f.r,'#ffffffb8')}
if(packing){radius=Math.min(43,radius+dt*16);$('size').textContent=radius<23?'Small & fluffy':radius<34?'Nice & round':'GIANT snowball!';$('status').textContent=radius>=43?'Maximum snow power!':'Packing more snow…'}ctx.fillStyle='#bfd7e780';ctx.beginPath();ctx.ellipse(500,538,65,13,0,0,Math.PI*2);ctx.fill();circle(500,510,radius+2,'#d0e1ed');circle(500,507,radius,'white');circle(492,499,radius*.25,'#f4faff');if(drag){ctx.save();ctx.setLineDash([5,9]);ctx.strokeStyle='#5686a1';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(500,490);ctx.quadraticCurveTo((500+drag.end.x)/2,Math.min(490,drag.end.y)-90,drag.end.x,drag.end.y);ctx.stroke();ctx.restore();circle(drag.end.x,drag.end.y,8,'#ec9790')}
balls=balls.filter(b=>{b.age+=dt;let u=Math.min(1,b.age/b.duration),x=500+(b.x-500)*u,y=510+(b.y-510)*u-150*Math.sin(Math.PI*u);circle(x+2,y+3,b.r*(1-u*.3),'#c9deec');circle(x,y,b.r*(1-u*.3),'#fff');if(u>=1){impact(b);return false}return true});particles=particles.filter(p=>{p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=320*dt;ctx.globalAlpha=Math.max(0,1-p.age);circle(p.x,p.y,p.r,'white');ctx.globalAlpha=1;return p.age<1})}
function frame(now){let dt=Math.min(.04,(now-last)/1000||.016);last=now;draw(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script><script src="../../analytics/config.js?v=f0864bb809c7"></script><script src="../../analytics/analytics.js?v=51cd0bb429b4"></script></body></html>
